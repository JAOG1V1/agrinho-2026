<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <!-- Fundo arredondado verde -->
    <rect width="100" height="100" rx="22" fill="#4f9d50"/>

    <!-- Folha esquerda (branca) -->
    <path d="M 50 62
             C 32 58, 22 46, 20 28
             C 36 28, 48 42, 50 62 Z"
          fill="#ffffff"/>

    <!-- Folha direita (verde claro) -->
    <path d="M 50 62
             C 68 58, 78 46, 80 28
             C 64 28, 52 42, 50 62 Z"
          fill="#a8d5a8"/>

    <!-- Caule -->
    <line x1="50" y1="62" x2="50" y2="82"
          stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
</svg>
